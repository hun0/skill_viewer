<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>프레임 뷰어</title>
<style>
  :root { --bg:#0b0b0c; --fg:#ececec; --muted:#8a8a8f; --line:#2c2c30; --btn:#1c1c1f; --accent:#e2b75c; --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-text-size-adjust: 100%; }
  body { min-height: 100dvh; display: flex; flex-direction: column; gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  button, input { font: inherit; color: inherit; }
  button { background: var(--btn); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; cursor: pointer; touch-action: manipulation; }
  button:active { transform: translateY(1px); }
  button[aria-pressed="true"] { background: var(--accent); color: #111; border-color: var(--accent); }
  .top { display: flex; align-items: center; gap: 8px; }
  .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top a { color: var(--muted); font-size: 13px; text-decoration: none; white-space: nowrap; }
  .stage { position: relative; width: 100%; max-width: 1280px; margin: 0 auto; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
  body.fs .stage { max-width: none; }
  #yt, #vid { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #vid { object-fit: contain; background: #000; }
  .pad { position: absolute; inset: 0; touch-action: none; cursor: ew-resize; }
  .hud { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgba(0,0,0,.7); padding: 4px 10px; border-radius: 6px; font-family: var(--mono); font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .hud.on { opacity: 1; }
  .msg { position: absolute; inset: auto 10px 10px 10px; background: rgba(0,0,0,.78); padding: 8px 10px; border-radius: 6px; font-size: 13px; pointer-events: none; }
  .time { display: flex; gap: 14px; justify-content: center; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 15px; }
  .time .f { color: var(--accent); }
  .time .d { color: var(--muted); }
  #seek { width: 100%; max-width: 1280px; margin: 0 auto; accent-color: var(--accent); height: 28px; }
  .ctl { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .ctl button { min-width: 58px; padding: 13px 10px; font-size: 15px; }
  .ctl .pp { min-width: 76px; background: var(--accent); color: #111; border-color: var(--accent); }
  .opt { display: flex; gap: 6px 10px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 13px; }
  .lbl { color: var(--muted); }
  .seg { display: inline-flex; gap: 4px; }
  .seg button { padding: 7px 10px; font-size: 13px; }
  .help { margin: 0; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .open { display: grid; gap: 8px; max-width: 640px; width: 100%; margin: 6px auto 0; }
  .open input[type=url] { width: 100%; background: #151517; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
  .open .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .open .row > * { flex: 1 1 140px; }
  .file { display: inline-flex; align-items: center; justify-content: center; background: var(--btn); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; cursor: pointer; }
  .file input { display: none; }
  .hide { display: none !important; }
</style>
</head>
<body>
  <div class="top">
    <div class="title" id="title">프레임 뷰어</div>
    <a id="ext" target="_blank" rel="noopener" class="hide">유튜브 ↗</a>
    <button id="fs" type="button" aria-label="전체화면">⛶</button>
  </div>

  <div class="stage" id="stage">
    <div id="yt"></div>
    <video id="vid" class="hide" playsinline preload="auto"></video>
    <div class="pad" id="pad" aria-hidden="true"></div>
    <div class="hud" id="hud"></div>
    <div class="msg" id="msg">위에서 유튜브 링크를 넣거나 기기의 영상 파일을 열어 주세요.</div>
  </div>

  <div class="time"><span id="t">0:00.00</span><span class="f" id="f">F 0</span><span class="d" id="d"></span></div>
  <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="재생 위치">

  <div class="ctl">
    <button type="button" data-step="-10" aria-label="10프레임 뒤로">−10</button>
    <button type="button" data-step="-1" aria-label="1프레임 뒤로">◀ 1f</button>
    <button type="button" class="pp" id="pp" aria-label="재생/정지">▶</button>
    <button type="button" data-step="1" aria-label="1프레임 앞으로">1f ▶</button>
    <button type="button" data-step="10" aria-label="10프레임 앞으로">+10</button>
  </div>
  <div class="opt">
    <span class="lbl">속도</span>
    <span class="seg" data-k="rate"><button type="button" data-v="0.25">0.25</button><button type="button" data-v="0.5">0.5</button><button type="button" data-v="1">1</button></span>
    <span class="lbl">프레임</span>
    <span class="seg" data-k="fps"><button type="button" data-v="24">24</button><button type="button" data-v="30">30</button><button type="button" data-v="60">60</button></span>
    <span class="lbl">구간</span>
    <span class="seg"><button type="button" data-ab="a">A</button><button type="button" data-ab="b">B</button><button type="button" data-ab="x">해제</button></span>
  </div>
  <p class="help">영상 위를 좌우로 끌면 프레임 이동 · 탭하면 재생/정지<br>키보드: ← → 1프레임 (Shift 10), Space 재생</p>

  <div class="open">
    <input type="url" id="url" placeholder="유튜브 링크 붙여넣기" aria-label="유튜브 링크">
    <div class="row">
      <button type="button" id="go">링크 열기</button>
      <label class="file">기기 영상 열기<input type="file" id="file" accept="video/*"></label>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const S = { mode: null, cur: 0, dur: 0, playing: false, fps: 30, rate: 1, sens: 8, a: null, b: null, yt: null, ytReady: false, pending: null, timer: null, raf: 0 };
const vid = $("#vid");

/* ---------- helpers ---------- */
function fmt(t) { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(2).padStart(5, "0")}`; }
function hud(txt) { const h = $("#hud"); h.textContent = txt; h.classList.add("on"); clearTimeout(hud._t); hud._t = setTimeout(() => h.classList.remove("on"), 700); }
function msg(txt) { const m = $("#msg"); m.textContent = txt || ""; m.classList.toggle("hide", !txt); }
function ytIdFrom(str) {
  if (!str) return null;
  str = str.trim();
  if (/^[\w-]{11}$/.test(str)) return { id: str, t: 0 };
  try {
    const u = new URL(str);
    let id = null;
    if (u.hostname.includes("youtu.be")) id = u.pathname.slice(1).split("/")[0];
    else if (u.hostname.includes("youtube")) { id = u.searchParams.get("v"); const m = u.pathname.match(/\/(shorts|embed|live)\/([^/?]+)/); if (!id && m) id = m[2]; }
    const t = parseInt(String(u.searchParams.get("t") || "0").replace(/s$/, ""), 10) || 0;
    return id ? { id, t } : null;
  } catch { return null; }
}

/* ---------- player abstraction ---------- */
const P = {
  time() { return S.mode === "file" ? vid.currentTime : (S.yt && S.ytReady ? S.yt.getCurrentTime() : S.cur); },
  duration() { return S.mode === "file" ? (vid.duration || 0) : (S.yt && S.ytReady ? S.yt.getDuration() : 0); },
  play() { if (S.mode === "file") vid.play(); else if (S.ytReady) S.yt.playVideo(); S.playing = true; loop(); },
  pause() { if (S.mode === "file") vid.pause(); else if (S.ytReady) S.yt.pauseVideo(); S.playing = false; },
  seek(t) {
    if (S.mode === "file") { vid.currentTime = t; return; }
    if (!S.ytReady) return;
    S.pending = t;
    if (!S.timer) S.timer = setTimeout(() => { S.timer = null; if (S.pending != null) { S.yt.seekTo(S.pending, true); S.pending = null; } }, 40);
  },
  rate(r) { if (S.mode === "file") vid.playbackRate = r; else if (S.ytReady) S.yt.setPlaybackRate(r); }
};
function seekTo(t, quiet) {
  const d = S.dur || P.duration();
  S.cur = Math.max(0, Math.min(d ? d - 0.001 : t, t));
  P.seek(S.cur);
  if (!quiet) hud(`${fmt(S.cur)} · F ${Math.round(S.cur * S.fps)}`);
  sync();
}
function step(n) { if (S.playing) P.pause(); seekTo(S.cur + n / S.fps); }
function toggle() { if (!S.mode) return; if (S.playing) { P.pause(); hud("❚❚"); } else { P.play(); hud("▶"); } sync(); }
function loop() {
  cancelAnimationFrame(S.raf);
  const tick = () => {
    if (!S.playing) return;
    S.cur = P.time(); S.dur = P.duration() || S.dur;
    if (S.a != null && S.b != null && S.cur >= S.b) { seekTo(S.a, true); if (S.mode === "yt") S.yt.seekTo(S.a, true); }
    sync();
    S.raf = requestAnimationFrame(tick);
  };
  S.raf = requestAnimationFrame(tick);
}
function sync() {
  $("#t").textContent = fmt(S.cur);
  $("#f").textContent = `F ${Math.round(S.cur * S.fps)}`;
  $("#d").textContent = S.dur ? `/ ${fmt(S.dur)}` : "";
  $("#pp").textContent = S.playing ? "❚❚" : "▶";
  if (S.dur && document.activeElement !== $("#seek")) $("#seek").value = Math.round(S.cur / S.dur * 1000);
  document.querySelectorAll(".seg[data-k] button").forEach(b => b.setAttribute("aria-pressed", String(S[b.parentElement.dataset.k] === +b.dataset.v)));
  $('[data-ab="a"]').textContent = S.a != null ? `A ${fmt(S.a)}` : "A";
  $('[data-ab="b"]').textContent = S.b != null ? `B ${fmt(S.b)}` : "B";
}

/* ---------- YouTube ---------- */
let ytApi = null;
function loadYT() {
  if (ytApi) return ytApi;
  ytApi = new Promise(res => {
    window.onYouTubeIframeAPIReady = () => res(window.YT);
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; s.onerror = () => msg("유튜브 플레이어를 불러오지 못했어요."); document.head.appendChild(s);
  });
  return ytApi;
}
async function openYT(id, start, title) {
  closeFile();
  S.mode = "yt"; S.ytReady = false; S.cur = start || 0; S.dur = 0; S.playing = false; S.a = S.b = null;
  $("#yt").classList.remove("hide");
  $("#title").textContent = title || "유튜브 영상";
  const ext = $("#ext"); ext.href = `https://www.youtube.com/watch?v=${id}${start ? "&t=" + start : ""}`; ext.classList.remove("hide");
  msg("불러오는 중…");
  const YT = await loadYT();
  const vars = { controls: 0, playsinline: 1, rel: 0, modestbranding: 1, disablekb: 1, iv_load_policy: 3, fs: 0, start: start || 0 };
  if (S.yt) { S.yt.loadVideoById({ videoId: id, startSeconds: start || 0 }); setTimeout(() => S.yt.pauseVideo(), 600); return; }
  S.yt = new YT.Player("yt", { videoId: id, playerVars: vars, events: {
    onReady: () => { S.ytReady = true; msg(""); S.yt.setPlaybackRate(S.rate); S.dur = S.yt.getDuration(); sync(); },
    onStateChange: e => {
      S.playing = e.data === 1; if (S.playing) loop();
      S.dur = S.yt.getDuration() || S.dur; if (!S.playing) { S.cur = S.yt.getCurrentTime(); } sync();
    },
    onError: e => msg(e.data === 101 || e.data === 150 ? "이 영상은 퍼가기가 막혀 있어요. 위의 ‘유튜브 ↗’로 열어 주세요." : "영상을 재생할 수 없어요."),
    onPlaybackRateChange: e => { S.rate = e.data; sync(); }
  } });
}

/* ---------- local file ---------- */
function closeFile() { if (vid.src) { URL.revokeObjectURL(vid.src); vid.removeAttribute("src"); vid.load(); } vid.classList.add("hide"); }
function openFile(f) {
  if (!f) return;
  if (S.yt && S.ytReady) S.yt.pauseVideo();
  $("#yt").classList.add("hide"); $("#ext").classList.add("hide");
  closeFile();
  S.mode = "file"; S.cur = 0; S.dur = 0; S.playing = false; S.a = S.b = null;
  vid.src = URL.createObjectURL(f); vid.classList.remove("hide"); vid.playbackRate = S.rate;
  $("#title").textContent = f.name; msg("");
  vid.onloadedmetadata = () => { S.dur = vid.duration; sync(); };
  vid.onseeked = () => { if (!S.playing) { S.cur = vid.currentTime; sync(); } };
  vid.onpause = () => { S.playing = false; sync(); };
  vid.onplay = () => { S.playing = true; loop(); };
}

/* ---------- input ---------- */
const pad = $("#pad"); let drag = null;
pad.addEventListener("pointerdown", e => { pad.setPointerCapture(e.pointerId); drag = { x: e.clientX, t0: S.cur, moved: false }; });
pad.addEventListener("pointermove", e => {
  if (!drag || !S.mode) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) < 6) return;
  if (!drag.moved) { drag.moved = true; if (S.playing) P.pause(); }
  seekTo(drag.t0 + Math.round(dx / S.sens) / S.fps);
});
pad.addEventListener("pointerup", () => { if (drag && !drag.moved) toggle(); drag = null; });
pad.addEventListener("pointercancel", () => { drag = null; });
$("#pp").onclick = toggle;
document.querySelectorAll("[data-step]").forEach(b => b.onclick = () => step(+b.dataset.step));
document.querySelectorAll(".seg[data-k] button").forEach(b => b.onclick = () => { const k = b.parentElement.dataset.k, v = +b.dataset.v; S[k] = v; if (k === "rate") P.rate(v); sync(); });
document.querySelectorAll("[data-ab]").forEach(b => b.onclick = () => {
  const w = b.dataset.ab;
  if (w === "x") S.a = S.b = null; else { S[w] = S.cur; if (S.a != null && S.b != null && S.b < S.a) [S.a, S.b] = [S.b, S.a]; }
  hud(w === "x" ? "구간 해제" : `${w.toUpperCase()} ${fmt(S.cur)}`); sync();
});
$("#seek").oninput = e => { if (!S.dur) return; if (S.playing) P.pause(); seekTo(e.target.value / 1000 * S.dur, true); };
$("#fs").onclick = () => { const d = document; if (d.fullscreenElement) d.exitFullscreen(); else (d.documentElement.requestFullscreen ? d.documentElement.requestFullscreen() : Promise.reject()).catch(() => {}); };
document.addEventListener("fullscreenchange", () => document.body.classList.toggle("fs", !!document.fullscreenElement));
$("#go").onclick = () => { const y = ytIdFrom($("#url").value); if (!y) { msg("유튜브 링크를 확인해 주세요."); return; } history.replaceState(null, "", `?v=${y.id}${y.t ? "&t=" + y.t : ""}`); openYT(y.id, y.t); };
$("#url").addEventListener("keydown", e => { if (e.key === "Enter") $("#go").click(); });
$("#file").onchange = e => openFile(e.target.files[0]);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.key === "ArrowLeft" || e.key === ",") { e.preventDefault(); step(e.shiftKey ? -10 : -1); }
  else if (e.key === "ArrowRight" || e.key === ".") { e.preventDefault(); step(e.shiftKey ? 10 : 1); }
  else if (e.key === " ") { e.preventDefault(); toggle(); }
});

/* ---------- boot from query string: ?v=ID&t=12&title=... or ?url=... ---------- */
const q = new URLSearchParams(location.search);
const y0 = q.get("v") ? { id: q.get("v"), t: parseInt(q.get("t") || "0", 10) || 0 } : ytIdFrom(q.get("url"));
if (y0) { $("#url").value = `https://www.youtube.com/watch?v=${y0.id}`; openYT(y0.id, y0.t, q.get("title")); }
sync();
</script>
</body>
</html>
